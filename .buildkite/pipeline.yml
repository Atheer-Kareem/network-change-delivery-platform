steps:
  - label: ":docker: Build validation environment"
    key: quality-env
    soft_fail: true
    command: |
      set -euo pipefail
      docker build --target quality-base --tag ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} .
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":git: Committed diff integrity"
    key: quality-committed-diff
    soft_fail: true
    command: |
      set -euo pipefail
      BASE_BRANCH="$${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-main}"
      git fetch --no-tags origin \
        "$${BASE_BRANCH}:refs/remotes/origin/$${BASE_BRANCH}"
      if [[ -n "$${BUILDKITE_PULL_REQUEST:-}" \
         && "$${BUILDKITE_PULL_REQUEST}" != "false" ]]; then
        git --no-pager diff --check \
          "$(git merge-base HEAD "origin/$${BASE_BRANCH}")..HEAD"
      else
        git --no-pager diff --check HEAD^..HEAD
      fi
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":mag: Ruff lint"
    key: quality-ruff-lint
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      docker run --rm ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} uv run ruff check .
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":art: Ruff format"
    key: quality-ruff-format
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      docker run --rm ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} uv run ruff format --check .
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":pytest: Python test suite"
    key: quality-pytest
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      docker run --rm ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} uv run pytest --ignore=tests/test_buildkite_pipeline.py
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":ansible: Ansible lint"
    key: quality-ansible-lint
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      docker run --rm ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} uv run ansible-lint
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":package: Python package build"
    key: quality-package-build
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      docker run --rm ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} uv build
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":terraform: Profiled staging Terraform static validation"
    key: quality-terraform-profiled-staging
    soft_fail: true
    command: |
      set -euo pipefail
      scripts/buildkite/profiled_terraform_validate.sh
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":gear: SNMP module reproducibility"
    key: quality-snmp-generator
    soft_fail: true
    command: |
      set -euo pipefail
      uv run --frozen python scripts/observability/check_snmp_generator.py
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":chart_with_upwards_trend: Observability runtime validation"
    key: quality-observability-runtime
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      NCDP_QUALITY_IMAGE=ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} scripts/observability/verify_runtime.sh
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":satellite: Synthetic SNMPv3 validation"
    key: quality-snmpv3-synthetic
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      NCDP_SKIP_OBSERVABILITY_REGRESSION=1 NCDP_QUALITY_IMAGE=ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} scripts/observability/verify_snmp_runtime.sh
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":buildkite: Buildkite definition · parse and secret scan"
    key: buildkite-definition
    soft_fail: true
    command: |
      set -euo pipefail
      buildkite-agent pipeline upload .buildkite/pipeline.yml --dry-run --format yaml --reject-secrets --reject-parse-warnings > /dev/null
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - label: ":shield: NCDP pipeline safety contract · graph, queues, gating, retries and paths"
    key: ncdp-pipeline-contract
    soft_fail: true
    depends_on: quality-env
    command: |
      set -euo pipefail
      docker run --rm ncdp-quality-env:$${BUILDKITE_BUILD_NUMBER} \
        uv run pytest tests/test_buildkite_pipeline.py -k 'not test_installed_buildkite_change_evaluation'
      uv run --frozen pytest tests/test_buildkite_pipeline.py -k test_installed_buildkite_change_evaluation
      uv run --frozen python scripts/buildkite/publish_validation_receipt.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - wait: ~
    key: validation-complete
    continue_on_failure: true

  - label: ":batfish: Profiled Batfish · four-device assurance"
    key: pr-batfish-assurance
    soft_fail: true
    depends_on: validation-complete
    if: build.pull_request.id != null || build.branch == "main"
    command: .buildkite/scripts/profiled_pr_batfish_assurance.sh
    agents:
      queue: ncdp-validation
    concurrency: 1
    concurrency_group: ncdp/batfish-assurance
    retry:
      automatic: false
      manual:
        allowed: false
        reason: "A fresh commit and build are required after assurance failure."

  - label: "Ephemeral/Profiled CML staging · create → read-only validate → destroy"
    key: cml-staging
    # Temporary PR/development exception: docs/roadmap.md. Main authority unchanged.
    if: build.branch == "main" && build.pull_request.id == null
    soft_fail: true
    depends_on:
      - validation-complete
      - pr-batfish-assurance
    command: .buildkite/scripts/profiled_cml_staging.sh
    agents:
      queue: ncdp-staging
    concurrency: 1
    concurrency_group: ncdp/cml-ephemeral-staging
    retry:
      automatic: false
      manual:
        allowed: false
        reason: "A new commit/build and explicit recovery of retained state are required."

  - label: "Profiled plan · live read-only preflight"
    key: profiled-live-plan
    depends_on: cml-staging
    if: build.branch == "main" && build.pull_request.id == null
    command: .buildkite/scripts/profiled_delivery.sh
    soft_fail: true
    agents:
      queue: ncdp-deploy
    retry:
      automatic: false
      manual:
        allowed: false
    concurrency: 1
    concurrency_group: ncdp/profiled-live-delivery

  - label: "Delivery decision · promotion or compliance"
    key: profiled-promotion
    depends_on: profiled-live-plan
    if: build.branch == "main" && build.pull_request.id == null
    command: .buildkite/scripts/profiled_delivery.sh
    soft_fail: true
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

  - block: "Human continuation · promoted change or compliance"
    key: profiled-human-authorization
    depends_on: profiled-promotion
    if: build.branch == "main" && build.pull_request.id == null
    prompt: >-
      For a real promotion, review the promoted schema-v2 plan; unblocking
      authorizes only this exact build/promotion. For COMPLIANT, no plan or
      promotion exists and continuation grants no write authority.
      Human continuation never repairs failed prerequisites.

  - label: "Profiled delivery · authorized execution or compliant no-write"
    key: profiled-deploy
    depends_on: profiled-human-authorization
    if: build.branch == "main" && build.pull_request.id == null
    command: .buildkite/scripts/profiled_delivery.sh
    soft_fail: true
    agents:
      queue: ncdp-deploy
    retry:
      automatic: false
      manual:
        allowed: false
    concurrency: 1
    concurrency_group: ncdp/profiled-live-delivery

  - label: "Deployment evidence · final outcome"
    key: profiled-deployment-evidence
    depends_on: profiled-deploy
    if: build.branch == "main" && build.pull_request.id == null
    command: .buildkite/scripts/profiled_delivery.sh
    soft_fail: true
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false

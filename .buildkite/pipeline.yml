# TEMPORARY JUNOS-001 PR REHEARSAL PIPELINE.
# Diagnostic only: restore the protected-main pipeline exactly before merge.
steps:
  - label: ":white_check_mark: exact PR rehearsal contract"
    key: rehearsal-contract
    command: |
      scripts/buildkite/verify_staging_commit.sh
      uv run python scripts/buildkite/verify_junos_rehearsal_contract.py
    agents:
      queue: ncdp-validation
    retry:
      automatic: false
      manual:
        allowed: false
        reason: "A rehearsal commit is immutable and must not be retried."

  - label: ":package: rehearsal promotion"
    key: rehearsal-promotion
    depends_on: rehearsal-contract
    command: .buildkite/scripts/junos_rehearsal_promotion.sh
    agents:
      queue: ncdp-validation
    concurrency: 1
    concurrency_group: ncdp/batfish-promotion
    retry:
      automatic: false
      manual:
        allowed: false
        reason: "A rehearsal promotion is immutable and must not be retried."

  - block: ":lock: Authorize Junos delivery rehearsal"
    key: junos-rehearsal-approval
    depends_on: rehearsal-promotion
    prompt: >-
      Authorize the exact PR-commit-bound promoted JUNOS-001 plan for one
      disposable-CML rehearsal only. This does not authorize live deployment.
    submit: "Authorize Junos delivery rehearsal"

  - label: ":cloud: disposable Junos SNMP delivery rehearsal"
    key: cml-staging
    depends_on: junos-rehearsal-approval
    command: scripts/buildkite/ephemeral_staging.sh
    agents:
      queue: ncdp-staging
    concurrency: 1
    concurrency_group: ncdp/cml-ephemeral-staging
    retry:
      automatic: false
      manual:
        allowed: false
        reason: "A commit-confirmed rehearsal operation must never be retried."

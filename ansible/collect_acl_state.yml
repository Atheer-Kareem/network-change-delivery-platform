---
- name: Collect bounded Cisco ACL security state
  hosts: all
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('ansible.builtin.env', 'NCDP_DEVICE_USERNAME') }}"
    ansible_password: "{{ lookup('ansible.builtin.env', 'NCDP_DEVICE_PASSWORD') }}"
  tasks:
    - name: NCDP inspect exact ACL security configuration
      cisco.ios.ios_command:
        commands: "{{ ncdp_acl_commands }}"
      changed_when: false

---
- name: Collect bounded Cisco IOS XE state
  hosts: all
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('ansible.builtin.env', 'NCDP_DEVICE_USERNAME') }}"
    ansible_password: "{{ lookup('ansible.builtin.env', 'NCDP_DEVICE_PASSWORD') }}"
  tasks:
    - name: NCDP collect identity
      cisco.ios.ios_facts:
        gather_subset:
          - min

    - name: NCDP collect interfaces
      cisco.ios.ios_interfaces:
        state: gathered

    - name: NCDP collect layer 3 interfaces
      cisco.ios.ios_l3_interfaces:
        state: gathered

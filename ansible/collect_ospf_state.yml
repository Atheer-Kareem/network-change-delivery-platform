---
- name: Collect bounded Cisco OSPF state
  hosts: all
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('ansible.builtin.env', 'NCDP_DEVICE_USERNAME') }}"
    ansible_password: "{{ lookup('ansible.builtin.env', 'NCDP_DEVICE_PASSWORD') }}"
  tasks:
    - name: NCDP inspect exact OSPF configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^router ospf
          - "show running-config interface {{ ncdp_ospf_interfaces[0] }}"
          - "show running-config interface {{ ncdp_ospf_interfaces[1] }}"
      changed_when: false

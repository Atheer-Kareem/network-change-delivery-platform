services:
  prometheus:
    networks:
      telemetry: {}
      snmp_control: {}
    depends_on:
      snmp_exporter:
        condition: service_started

  snmp_exporter:
    image: prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    container_name: ${NCDP_SNMP_EXPORTER_CONTAINER:-ncdp-snmp-exporter}
    pull_policy: never
    restart: "no"
    user: "${NCDP_OBSERVABILITY_UID:?current UID required}:${NCDP_OBSERVABILITY_GID:?current GID required}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/ncdp/snmp/modules/snmp-modules.yml
      - --config.file=/etc/ncdp/snmp/auth/snmp-auth.yml
    volumes:
      - type: bind
        source: ${NCDP_SNMP_MODULE_ROOT:?reviewed SNMP module root required}
        target: /etc/ncdp/snmp/modules
        read_only: true
      - type: bind
        source: ${NCDP_SNMP_AUTH_ROOT:?private SNMP auth root required}
        target: /etc/ncdp/snmp/auth
        read_only: true
    networks: [snmp_control, snmp_device]

networks:
  snmp_control:
    name: ${NCDP_SNMP_CONTROL_NETWORK:-ncdp-observability-snmp-control}
    internal: true
    labels:
      com.ncdp.service: observability-snmp-control
  snmp_device:
    name: ${NCDP_SNMP_DEVICE_NETWORK:-ncdp-observability-snmp-device}
    internal: false
    labels:
      com.ncdp.service: observability-snmp-device

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ncdp-management-service
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    file_sd_configs:
      - files:
          - /etc/ncdp/targets/targets.json
        refresh_interval: 15s
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: ncdp-blackbox-exporter
    static_configs:
      - targets:
          - blackbox:9115

  - job_name: ncdp-prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

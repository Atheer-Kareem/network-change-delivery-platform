rule_files:
  - 11b-alerts.yml

tests:
  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '1x19'
      - series: 'up{job="ncdp-blackbox-exporter"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 1m
        alertname: NCDPManagementServiceDown
        exp_alerts: []
      - eval_time: 1m
        alertname: NCDPManagementTargetsStale
        exp_alerts: []
      - eval_time: 1m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x23'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '1x4 0x16 1x4'
    alert_rule_test:
      - eval_time: 2m45s
        alertname: NCDPManagementServiceDown
        exp_alerts: []
      - eval_time: 4m
        alertname: NCDPManagementServiceDown
        exp_alerts:
          - exp_labels:
              instance: netbox:dcim.device:2
              job: ncdp-management-service
              severity: warning
              component: management-reachability
            exp_annotations:
              summary: Management TCP connection unavailable
              description: The admitted management TCP connection is unavailable; this does not indicate authentication or device failure.
      - eval_time: 5m
        alertname: NCDPManagementServiceDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '0x19'
    alert_rule_test:
      - eval_time: 3m
        alertname: NCDPManagementTargetsStale
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 3m
        alertname: NCDPManagementTargetsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: target-population
            exp_annotations:
              summary: Management target population is stale
              description: Fewer than two admitted management reachability series have recent samples.

  - interval: 15s
    alert_rule_test:
      - eval_time: 2m
        alertname: NCDPManagementTargetsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: target-population
            exp_annotations:
              summary: Management target population is stale
              description: Fewer than two admitted management reachability series have recent samples.

  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19 _x20'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '1x39'
    alert_rule_test:
      - eval_time: 8m
        alertname: NCDPManagementTargetsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: target-population
            exp_annotations:
              summary: Management target population is stale
              description: Fewer than two admitted management reachability series have recent samples.

  - interval: 15s
    input_series:
      - series: 'up{job="ncdp-blackbox-exporter"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '0x19'
    alert_rule_test:
      - eval_time: 4m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{job="ncdp-blackbox-exporter"}'
        values: '0x16 1x8'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []
      - eval_time: 3m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts:
          - exp_labels:
              job: ncdp-blackbox-exporter
              severity: critical
              component: blackbox-pipeline
            exp_annotations:
              summary: Blackbox probe pipeline unavailable
              description: The Blackbox exporter scrape path is unavailable; this is distinct from endpoint probe failure.
      - eval_time: 4m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []

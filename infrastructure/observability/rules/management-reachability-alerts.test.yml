rule_files:
  - management-reachability-alerts.yml

tests:
  # All four canonical profiled targets are recent and healthy.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:8"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:9"}'
        values: '1x19'
      - series: 'up{job="ncdp-blackbox-exporter"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 1m
        alertname: NCDPManagementServiceDown
        exp_alerts: []
      - eval_time: 1m
        alertname: NCDPManagementTargetsStale
        exp_alerts: []
      - eval_time: 1m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []

  # All four series remain present while one endpoint is down: this is not
  # stale population, but the endpoint-specific service alert fires.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x23'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '1x4 0x16 1x4'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:8"}'
        values: '1x23'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:9"}'
        values: '1x23'
    alert_rule_test:
      - eval_time: 4m
        alertname: NCDPManagementTargetsStale
        exp_alerts: []
      - eval_time: 4m
        alertname: NCDPManagementServiceDown
        exp_alerts:
          - exp_labels:
              instance: netbox:dcim.device:2
              job: ncdp-management-service
              severity: warning
              component: management-reachability
            exp_annotations:
              summary: Management TCP connection unavailable
              description: The admitted management TCP connection is unavailable; this does not indicate authentication or device failure.
      - eval_time: 6m
        alertname: NCDPManagementServiceDown
        exp_alerts: []

  # Three recent target series are below the exact-four population threshold.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:2"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:8"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 3m
        alertname: NCDPManagementTargetsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: target-population
            exp_annotations:
              summary: Management target population is stale
              description: Fewer than four admitted management reachability series have recent samples.

  # One recent target series is also stale population.
  - interval: 15s
    input_series:
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '1x19'
    alert_rule_test:
      - eval_time: 3m
        alertname: NCDPManagementTargetsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: target-population
            exp_annotations:
              summary: Management target population is stale
              description: Fewer than four admitted management reachability series have recent samples.

  # No recent target series is stale population.
  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 2m
        alertname: NCDPManagementTargetsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: target-population
            exp_annotations:
              summary: Management target population is stale
              description: Fewer than four admitted management reachability series have recent samples.

  # Blackbox pipeline alert behavior remains independent of endpoint probes.
  - interval: 15s
    input_series:
      - series: 'up{job="ncdp-blackbox-exporter"}'
        values: '1x19'
      - series: 'probe_success{job="ncdp-management-service",instance="netbox:dcim.device:1"}'
        values: '0x19'
    alert_rule_test:
      - eval_time: 4m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{job="ncdp-blackbox-exporter"}'
        values: '0x16 1x8'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []
      - eval_time: 3m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts:
          - exp_labels:
              job: ncdp-blackbox-exporter
              severity: critical
              component: blackbox-pipeline
            exp_annotations:
              summary: Blackbox probe pipeline unavailable
              description: The Blackbox exporter scrape path is unavailable; this is distinct from endpoint probe failure.
      - eval_time: 5m
        alertname: NCDPBlackboxPipelineDown
        exp_alerts: []
